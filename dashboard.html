<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My dashboard | MNM</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050f22" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app" data-role="student">
  <a class="skip" href="#main">Skip to content</a>
  <aside class="side" aria-label="Dashboard menu">
    <a class="side-brand" href="index.html" aria-label="MNM home"><img src="assets/logo-dark.webp" alt="MNM" width="40" height="39" /><span>MNM</span></a>
    <nav class="side-nav">
      <a href="#overview" data-title="Overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Overview</a>
      <a href="#tracks" data-title="My tracks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>My tracks</a>
      <a href="#workshops" data-title="Workshops"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4m8-4v4"/></svg>Workshops</a>
      <a href="#challenges" data-title="Challenges"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4m8-4h3a3 3 0 0 1-3 4m-4 3v4m-4 4h8"/></svg>Challenges</a>
      <a href="hub.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Opportunities</a>
      <a href="#settings" data-title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/></svg>Profile</a>
      <a href="admin.html" data-admin-only hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg>Admin</a>
    </nav>
    <div class="side-user">
      <span class="avatar" data-user-initials></span>
      <span class="who"><b data-user-name></b><small data-user-email></small></span>
      <button class="icon-btn" type="button" data-signout aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    </div>
  </aside>
  <div class="scrim" aria-hidden="true"></div>

  <div class="main" id="main">
    <header class="top">
      <button class="icon-btn menu-btn" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="view-title">Overview</h1>
      <a class="btn btn-sm btn-ghost" href="index.html"><span>Back to site</span></a>
    </header>

    <!-- OVERVIEW -->
    <section class="view" id="overview" tabindex="-1">
      <div class="hello">
        <div>
          <p class="eyebrow">Welcome back</p>
          <h2>Hi, <span data-user-first></span> 👋</h2>
          <p class="muted">Here's what's next on your MNM journey.</p>
        </div>
        <div class="level-ring" id="level-ring" aria-label="Level"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52"/></svg><b>7</b><small>Level</small></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="grid-2">
        <article class="panel-card">
          <header><h3>Continue learning</h3><button class="text-btn" data-go="tracks">All tracks →</button></header>
          <div id="ov-tracks" class="track-list"></div>
        </article>
        <article class="panel-card">
          <header><h3>Your next workshops</h3><button class="text-btn" data-go="workshops">See all →</button></header>
          <ul id="ov-workshops" class="list"></ul>
        </article>
      </div>
      <div class="grid-2">
        <article class="panel-card challenge-card" id="ov-challenge"></article>
        <article class="panel-card">
          <header><h3>Announcements</h3></header>
          <ul id="ov-news" class="list news"></ul>
        </article>
      </div>
    </section>

    <!-- TRACKS -->
    <section class="view" id="tracks" tabindex="-1" hidden>
      <div class="cards-3" id="track-cards"></div>
    </section>

    <!-- WORKSHOPS -->
    <section class="view" id="workshops" tabindex="-1" hidden>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filter workshops">
          <button class="seg-btn" aria-pressed="true" data-filter="all">All</button>
          <button class="seg-btn" aria-pressed="false" data-filter="mine">Registered</button>
          <button class="seg-btn" aria-pressed="false" data-filter="neuro">Neuroscience</button>
          <button class="seg-btn" aria-pressed="false" data-filter="med">Medicine</button>
          <button class="seg-btn" aria-pressed="false" data-filter="math">Math</button>
        </div>
      </div>
      <div class="ws-grid" id="ws-grid"></div>
    </section>

    <!-- CHALLENGES -->
    <section class="view" id="challenges" tabindex="-1" hidden>
      <div class="grid-2">
        <article class="panel-card challenge-card big" id="ch-main"></article>
        <article class="panel-card">
          <header><h3>Leaderboard · November</h3></header>
          <ol class="board" id="board"></ol>
        </article>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="settings" tabindex="-1" hidden>
      <article class="panel-card narrow">
        <header><h3>Profile</h3></header>
        <form class="form" id="profile-form">
          <label class="field"><span>Name</span><input name="name" data-user-value="name" /></label>
          <label class="field"><span>Email</span><input name="email" type="email" data-user-value="email" disabled /></label>
          <label class="field"><span>Main interest</span>
            <select name="track"><option value="neuro">Neuroscience</option><option value="med">Medicine</option><option value="math">Mathematics</option></select></label>
          <label class="check"><input type="checkbox" checked /><span>Email me about new workshops and challenges</span></label>
          <div class="row-end"><button class="btn btn-sm" type="submit"><span>Save changes</span></button></div>
        </form>
      </article>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
