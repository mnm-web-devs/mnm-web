<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | MNM</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050f22" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/friendly.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app admin" data-role="admin">
  <a class="skip" href="#main">Skip to content</a>
  <aside class="side" aria-label="Admin menu">
    <a class="side-brand" href="index.html" aria-label="MNM home"><img src="assets/logo-dark.webp" alt="MNM" width="40" height="39" /><span>MNM <em>Admin</em></span></a>
    <nav class="side-nav">
      <a href="#overview" data-title="Overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Overview</a>
      <a href="#students" data-title="Students"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 2 5.3 4.9"/></svg>Students</a>
      <a href="#workshops" data-title="Workshops"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4m8-4v4"/></svg>Workshops</a>
      <a href="#submissions" data-title="Submissions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13l2 2 4-4"/></svg>Submissions <span class="count" id="c-sub"></span></a>
      <a href="#inquiries" data-title="Partners &amp; sponsors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Partners <span class="count" id="c-inq"></span></a>
      <a href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/></svg>Student view</a>
    </nav>
    <div class="side-user">
      <span class="avatar" data-user-initials></span>
      <span class="who"><b data-user-name></b><small>Admin</small></span>
      <button class="icon-btn" type="button" data-signout aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    </div>
  </aside>
  <div class="scrim" aria-hidden="true"></div>

  <div class="main" id="main">
    <header class="top">
      <button class="icon-btn menu-btn" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="view-title">Overview</h1>
      <button class="btn btn-sm" type="button" data-new-ws><span>+ New workshop</span></button>
    </header>

    <!-- OVERVIEW -->
    <section class="view" id="overview" tabindex="-1">
      <div class="stats" id="a-stats"></div>
      <div class="grid-2 wide-left">
        <article class="panel-card">
          <header><h3>Registrations · last 14 days</h3><span class="muted small" id="chart-total"></span></header>
          <div class="chart" id="chart" role="img" aria-label="Daily registrations for the last 14 days"></div>
        </article>
        <article class="panel-card">
          <header><h3>Students by track</h3></header>
          <div id="split" class="split-bars"></div>
        </article>
      </div>
      <div class="grid-2">
        <article class="panel-card">
          <header><h3>Needs review</h3><button class="text-btn" data-go="submissions">Open queue →</button></header>
          <ul class="list" id="a-review"></ul>
        </article>
        <article class="panel-card">
          <header><h3>New partner inquiries</h3><button class="text-btn" data-go="inquiries">See all →</button></header>
          <ul class="list" id="a-inq"></ul>
        </article>
      </div>
    </section>

    <!-- STUDENTS -->
    <section class="view" id="students" tabindex="-1" hidden>
      <div class="toolbar">
        <label class="search sm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="q" placeholder="Search name, email or country" aria-label="Search students" /></label>
        <select id="f-track" aria-label="Filter by track"><option value="">All tracks</option><option value="neuro">Neuroscience</option><option value="med">Medicine</option><option value="math">Mathematics</option><option value="all">All STEM interests</option></select>
        <select id="f-status" aria-label="Filter by status"><option value="">Any status</option><option value="active">Active</option><option value="new">New</option><option value="pending">Pending</option></select>
        <button class="btn btn-sm btn-ghost" type="button" id="export"><span>Export CSV</span></button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th><button data-sort="name">Student</button></th><th><button data-sort="country">Country</button></th>
            <th><button data-sort="track">Track</button></th><th><button data-sort="xp">XP</button></th>
            <th><button data-sort="joined">Joined</button></th><th>Status</th>
          </tr></thead>
          <tbody id="s-body"></tbody>
        </table>
      </div>
      <p class="muted small" id="s-count"></p>
    </section>

    <!-- WORKSHOPS -->
    <section class="view" id="workshops" tabindex="-1" hidden>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Workshop</th><th>Track</th><th>Date</th><th>Seats</th><th><span class="sr">Actions</span></th></tr></thead>
          <tbody id="w-body"></tbody>
        </table>
      </div>
    </section>

    <!-- SUBMISSIONS -->
    <section class="view" id="submissions" tabindex="-1" hidden>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filter submissions">
          <button class="seg-btn" aria-pressed="true" data-sf="pending">Pending</button>
          <button class="seg-btn" aria-pressed="false" data-sf="approved">Approved</button>
          <button class="seg-btn" aria-pressed="false" data-sf="rejected">Rejected</button>
        </div>
      </div>
      <div class="sub-list" id="sub-list"></div>
    </section>

    <!-- INQUIRIES -->
    <section class="view" id="inquiries" tabindex="-1" hidden>
      <div class="sub-list" id="inq-list"></div>
    </section>
  </div>

  <!-- new workshop modal -->
  <div class="modal" id="ws-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ws-modal-t">
    <form class="modal-card form" id="ws-form" novalidate>
      <header><h3 id="ws-modal-t">New workshop</h3><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></header>
      <label class="field"><span>Title</span><input name="title" required placeholder="e.g. Intro to the brain" /></label>
      <div class="row-2">
        <label class="field"><span>Track</span><select name="track"><option value="neuro">Neuroscience</option><option value="med">Medicine</option><option value="math">Mathematics</option></select></label>
        <label class="field"><span>Seats</span><input name="seats" type="number" min="1" value="40" required /></label>
      </div>
      <div class="row-2">
        <label class="field"><span>Date &amp; time</span><input name="date" type="datetime-local" required /></label>
        <label class="field"><span>Length (min)</span><input name="mins" type="number" min="10" step="5" value="60" required /></label>
      </div>
      <label class="field"><span>Host</span><input name="host" placeholder="Team or speaker" /></label>
      <p class="form-msg" role="alert"></p>
      <div class="row-end"><button class="btn btn-sm btn-ghost" type="button" data-close><span>Cancel</span></button><button class="btn btn-sm" type="submit"><span>Create</span></button></div>
    </form>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
